{% extends "base.html" %}

{% block content %}

<h1 style="color:#FEF960;">Your Dashboard</h1>
<h3 style="color:#F3C976;">Welcome, {{ username }}!</h3>
<a href="/create"><button>Create New</button></a>
<br><br>
<a href="/logout"><button>Logout</button></a>
<p class="error">{{ error }}</p>
</div>  

{% for entry in entries %}
<div class="card">
    <h2>Your Entries</h2>
    <a href="/create"><button>Create New</button></a>
    <!-- DO NOT MOVE OUTSIDE OF DIV, IT BREAKS EVERYTHING -->
    <br><br>
    <!-- <div> Might be an issue here-->
    <!-- title. DO NOT DEL -->
    <h3>{{ entry['title'] }}</h3>
    <!-- content DO NOT DEL-->
    <p>{{ entry['content'] }}</p>
    <a href="/edit/{{ entry['id'] }}">Edit</a>
    <a href="/delete/{{ entry['id'] }}">Delete</a>
    <hr>
    <!--</div> -->
    <!--{% endfor %} -->

    <!-- <a href="/logout"><button>Logout</button></a> -->
</div>

{% endblock %}
